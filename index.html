<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智卷工坊">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="AI 驱动的教学资料生成工具">
  <title>智卷工坊</title>
  <style>html,body{background:#f5f7fc;}#app:empty::after{content:'⏳ 正在加载…';display:block;padding:40px 20px;text-align:center;color:#999;font-family:sans-serif;font-size:14px;}</style>
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <div id="app"></div>
  <script>
    // ═══ 第1步：先注册错误捕获（必须在任何可能抛异常的操作之前） ═══
    var __t0=Date.now();
    var __diag=[]; // 诊断日志积累
    window.__showError=function(msg){var el=document.getElementById('app');if(el)el.innerHTML='<div style="padding:40px 20px;font-family:sans-serif;color:#e53935;text-align:center;"><h2>⚠️ 启动异常</h2><pre style="text-align:left;background:#fff3f3;padding:16px;border-radius:8px;overflow:auto;max-height:70vh;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all;">'+msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre></div>'};
    window.addEventListener('error',function(e){
      var isJsError=e instanceof ErrorEvent;
      var isScript=e.target&&e.target.tagName==='SCRIPT';
      if(!isJsError&&!isScript){return;}
      var msg=e.message||'(无)';
      if(msg.indexOf('MIME type')!==-1||msg.indexOf('module script')!==-1)msg+='\n\n🔍 MIME类型错误: Capacitor HTTP服务器可能未设置.js的Content-Type为application/javascript';
      var info='[error]\ntype='+e.type+'\nmessage='+msg+'\nfilename='+(e.filename||'(无)')+'\nlineno='+(e.lineno||'?')+'\nisErrorEvent='+isJsError+'\ntarget='+((e.target&&e.target.tagName)||e.target||'window');
      if(isScript)info+='\nsrc='+(e.target.src||e.target.getAttribute('src')||'?');
      if(e.error&&e.error.stack)info+='\nstack='+e.error.stack.slice(0,500);
      window.__showError(info);
    },true);
    window.addEventListener('unhandledrejection',function(e){window.__showError('Promise异常: '+(e.reason?.message||e.reason?.stack||String(e.reason)));});

    // ═══ 第2步：安全DOM操作（此时错误处理器已就绪） ═══
    var __body=document.body||document.documentElement;
    // 可见标记：body背景变绿 = JS引擎活着
    try{__body.style.backgroundColor='#e8f5e9';}catch(e){}
    // 状态条（如果body可用）
    var __status=null;
    try{
      if(document.body){
        __status=document.createElement('div');
        __status.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;padding:2px 8px;font-size:10px;font-family:monospace;background:#c8e6c9;color:#1b5e20;text-align:center;pointer-events:none;';
        __status.textContent='JS✓ | t=0ms | online='+navigator.onLine;
        document.body.appendChild(__status);
      }
    }catch(e){window.__showError('状态条初始化失败: '+e.message);}

    // ═══ 第3步：MutationObserver + ES模块测试 + 超时诊断 ═══
    var __appEl=document.getElementById('app');
    if(__appEl&&typeof MutationObserver!=='undefined'){
      try{var __mo=new MutationObserver(function(){var n=__appEl.childNodes.length;if(__status)__status.textContent+=' | #app:'+n;if(n>0){if(__status)__status.textContent+=' ✓';__mo.disconnect();}});__mo.observe(__appEl,{childList:true,subtree:true});}catch(e){}
    }
    // 内联ES模块测试
    try{var tm=document.createElement('script');tm.type='module';tm.textContent='window.__esModuleOk=!0;';document.head.appendChild(tm);}catch(e){}
    // 模块脚本加载监听
    setTimeout(function(){
      var ss=document.querySelectorAll('script[type="module"]');
      for(var i=0;i<ss.length;i++){
        ss[i].addEventListener('load',function(){if(__status)__status.textContent+=' | 模块✓';});
        ss[i].addEventListener('error',function(){window.__showError('❌ 模块脚本加载失败: '+(this.src||'未知'));});
      }
    },0);
    // ES模块检测
    setTimeout(function(){
      if(__status){
        if(window.__esModuleOk)__status.textContent+=' | ES✓';
        else{__status.textContent+=' | ES✗!';__status.style.background='#ffcdd2';__status.style.color='#b71c1c';}
      }
    },200);
    // 3秒诊断
    setTimeout(function(){var app=document.getElementById('app');if(app&&app.children.length===0)window.__showError('⚠️ 3s: Vue未挂载\n\n可能: 模块脚本加载失败 / 路由懒加载组件超时 / JS报错导致Vue初始化失败\n\n连接 chrome://inspect 查看console')},3000);
    // 15秒超时
    setTimeout(function(){var app=document.getElementById('app');if(app&&app.children.length===0)window.__showError('⏱ 超时('+((Date.now()-__t0)/1000).toFixed(1)+'s): Vue未挂载\n\n可能: 模块加载失败 / 路由卡死 / JS报错')},15000);
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
