name: iOS Build

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write  # 允许创建 Release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web & sync to iOS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:cap

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve SPM packages
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -scmProvider system

      - name: Build iOS (ad-hoc signed for re-signing)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "XCODEBUILD FAILED (exit code: $EXIT_CODE)"
            echo "========================================"
            echo ""
            echo ">>> Last 80 lines of build log:"
            tail -80 xcodebuild.log
            echo ""
            echo ">>> Searching for errors in full log:"
            grep -i -A2 "error:" xcodebuild.log | head -40 || echo "(no 'error:' lines found)"
            exit 1
          fi

          # Ad-hoc sign the .app so re-signing tools (爱思助手) can work with it
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found app at: $APP_PATH"
          echo "Applying ad-hoc signature..."
          codesign --sign - --force --deep --timestamp=none "$APP_PATH"

      - name: Package as IPA
        working-directory: ios/App
        run: |
          # Find the built .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app"
            exit 1
          fi

          # Create IPA structure
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Create IPA (zip + rename)
          zip -r "zhijuan.ipa" Payload/
          rm -rf Payload

          echo "IPA created: zhijuan.ipa"
          ls -lh "zhijuan.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhijuan-iOS
          path: ios/App/zhijuan.ipa
          retention-days: 7

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: "📱 iOS Build #${{ github.run_number }}"
          body: |
            ## 智卷工坊 iOS IPA
            
            - 构建时间: ${{ github.event.head_commit.timestamp || 'now' }}
            - 提交: ${{ github.event.head_commit.message || 'manual' }}
            - 运行编号: #${{ github.run_number }}
            
            ### 📥 使用方法
            1. 下载 `zhijuan.ipa`
            2. 用**爱思助手**签名安装（推荐）
            3. 或运行 `scripts/renew-ios.ps1` 一键续签
            
            > ⚠️ 免费 Apple ID 签名 7 天后到期，需重新安装
          files: ios/App/zhijuan.ipa
          draft: false
          prerelease: false
          make_latest: true
