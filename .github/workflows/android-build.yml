name: Android Build

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        # 🔧 v6 起底层运行时为 node24（v4 的 node20 将于 2026-09-16 被 GitHub 移除）
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        # 🔧 v4 已弃用（不再接收更新），v5 参数兼容（temurin + 21）
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        # 🔧 弃用 android-actions/setup-android@v3（第三方 action 仍是 node20 运行时，无 node24 版本），
        #    改用 ubuntu runner 预装 SDK 的 sdkmanager 直接补装所需组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build web & sync to Android (含验证)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # build:cap = vite build → cap sync → verify-cap-build（验证关键配置防白屏）
        run: npm run build:cap

      - name: Build Android APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find android -name "*.apk" | head -1)
          echo "APK found at: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        # 🔧 v5 运行时为 node24
        uses: actions/upload-artifact@v5
        with:
          name: zhijuan-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Publish to GitHub Release
        # 🔧 弃用 softprops/action-gh-release（第三方 action 仍是 node20 运行时），
        #    改用 runner 预装的 gh CLI 创建 Release，不再依赖第三方 action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(cat <<'EOF'
          ## 智卷工坊 Android APK
          
          - 构建时间: ${{ github.event.head_commit.timestamp || 'now' }}
          - 提交: ${{ github.event.head_commit.message || 'manual' }}
          - 运行编号: #${{ github.run_number }}
          
          ### 📥 使用方法
          1. 下载 `zhijuan.apk`
          2. 传到手机直接安装
          3. 如提示"未知来源"，在设置中允许即可
          
          > ✅ Android APK 无需签名，永久有效
          EOF
          )
          gh release create "android-build-${{ github.run_number }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "🤖 Android Build #${{ github.run_number }}" \
            --notes "$BODY" \
            --latest
