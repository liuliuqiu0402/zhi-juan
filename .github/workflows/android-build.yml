name: Android Build

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Build web & sync to Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:cap

      - name: Copy web assets to Android
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find android -name "*.apk" | head -1)
          echo "APK found at: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhijuan-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "🤖 Android Build #${{ github.run_number }}"
          body: |
            ## 智卷工坊 Android APK

            - 构建时间: ${{ github.event.head_commit.timestamp || 'now' }}
            - 提交: ${{ github.event.head_commit.message || 'manual' }}
            - 运行编号: #${{ github.run_number }}

            ### 📥 使用方法
            1. 下载 `zhijuan.apk`
            2. 传到手机直接安装
            3. 如提示"未知来源"，在设置中允许即可

            > ✅ Android APK 无需签名，永久有效
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
