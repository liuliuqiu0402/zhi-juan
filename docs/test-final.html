<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终测试 - 文中加点字</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            padding: 40px;
            background: #f5f7fc;
            line-height: 1.8;
        }

        .test-box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 文中加点字 - 最稳定方案：用background画点 */
        .emphasis-dot {
            display: inline;
            font-weight: bold;
            color: #d32f2f;
            background: radial-gradient(circle, #d32f2f 50%, transparent 50%) no-repeat center bottom;
            background-size: 0.35em 0.35em;  /* 根据字体大小自动适配 */
            padding-bottom: 0.5em;
        }

        /* 拼音标注 - 使用ruby标签原生支持 */
        ruby {
            ruby-position: over;
        }

        .text-content {
            font-size: 16px;
            line-height: 2;
            text-indent: 2em;
        }
    </style>
</head>
<body>
    <h1>最终测试 - 文中加点字</h1>
    
    <div class="test-box">
        <h2>测试1: 单独的加点字</h2>
        <p>加点字测试：<span class="emphasis-dot">复</span></p>
    </div>

    <div class="test-box">
        <h2>测试2: 文中的加点字</h2>
        <p class="text-content">
            春天来了，大地<span class="emphasis-dot">复</span>苏，万物生长。在这美好的季节里，花儿竞相开放。
        </p>
    </div>

    <div class="test-box">
        <h2>测试3: 多个文中加点字</h2>
        <p class="text-content">
            下列词语中，<span class="emphasis-dot">和</span>平的读音与其他三项不同的是：应<span class="emphasis-dot">和</span>、<span class="emphasis-dot">和</span>蔼、<span class="emphasis-dot">和</span>气。
        </p>
    </div>

    <div class="test-box">
        <h2>测试4: 拼音标注</h2>
        <p>
            给下列字注音：<ruby>花<rt>huā</rt></ruby>、<ruby>春<rt>chūn</rt></ruby>、<ruby>天<rt>tiān</rt></ruby>
        </p>
    </div>

    <div class="test-box">
        <h2>测试5: 文中加点字 + 拼音组合</h2>
        <p class="text-content">
            在这美好的季节里，<ruby>花<rt>huā</rt></ruby>儿竞相开放，鸟儿欢快地歌唱。<span class="emphasis-dot">复</span>苏的大地充满生机。
        </p>
    </div>
</body>
</html>
